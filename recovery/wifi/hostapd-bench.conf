# Bench-only access point for the RAM Wi-Fi probe. Radio settings follow the
# stock /etc/hostapd/hostapd.conf (5 GHz channel 36, HT40+); SSID and
# passphrase are bench values, and the stock CarPlay vendor element is omitted.
interface=wlan0
ctrl_interface=/var/run/hostapd
driver=nl80211
ssid=AUTOTOP-BENCH
hw_mode=a
channel=36
ieee80211n=1
ht_capab=[SHORT-GI-20][SHORT-GI-40][HT40+]
wmm_enabled=1
beacon_int=100
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
wpa_passphrase=autotop-bench-only
max_num_sta=4
